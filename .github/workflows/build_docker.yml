name: Build Docker

on: 
  push
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3.3.0
      - name: Docker login
        uses: docker/login-action@v2.1.0
        with:
          username: ${{ DOCKER_PASSWORD }}
          password: ${{ DOCKER_PASSWORD }}
          
   
